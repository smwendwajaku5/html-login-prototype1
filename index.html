<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102115">
    <title>Create your account</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="auth-card">
        <p class="eyebrow">ENTER THE REALM</p>
        <h1 id="form-title">Create your account</h1>
        <p class="subtitle" id="form-subtitle">Join the adventure. Your journey starts here.</p>

        <form class="auth-form" id="auth-form">
            <div class="field" id="name-field">
                <label for="name">Username</label>
                <input type="text" id="name" name="username" placeholder="Choose a username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_\-]+" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" maxlength="254" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <div class="field" id="confirm-field">
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Enter your password again" autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <button class="submit-button" type="submit" id="submit-button">Create account</button>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>

        <p class="form-divider">or</p>
        <a class="google-button" href="/auth/google">Continue with Google</a>

        <p class="toggle-prompt">
            <span id="toggle-copy">Already have an account?</span>
            <button class="toggle-button" id="mode-toggle" type="button" aria-controls="auth-form">Sign in</button>
        </p>

        <section class="session-panel" id="session-panel" aria-live="polite" hidden>
            <p id="session-copy"></p>
            <button class="signout-button" id="signout-button" type="button">Sign out</button>
        </section>
    </main>
</body>
</html>
